<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>会社管理 | 口座・経費・決算管理</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script>

<style>
  :root{
    --ink:#1C2B39;
    --bg:#F7F5F1;
    --card:#FFFFFF;
    --accent:#2F7A6B;
    --accent-soft:#E4EFEC;
    --positive:#3F8F5F;
    --positive-soft:#E7F3EC;
    --negative:#B4533D;
    --negative-soft:#F7EAE5;
    --warn:#B98A2E;
    --warn-soft:#F6EFDF;
    --muted:#7C8A93;
    --border:#E2DED4;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
    margin:0 0 4px 0;
    letter-spacing:.01em;
  }
  .num{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:11px 18px;
    font-size:14px;
    font-weight:600;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--accent-soft);
    outline-offset:1px;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{opacity:.88;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{opacity:.88;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{background:#fff;}
  .btn-approve{background:var(--positive);color:#fff;padding:7px 14px;font-size:13px;}
  .btn-reject{background:transparent;color:var(--negative);border:1px solid var(--negative);padding:7px 14px;font-size:13px;}
  input,select,textarea{
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}

  .wave{width:100%;height:20px;display:block;opacity:.55;margin:28px 0;}

  /* --- ゲート画面 --- */
  .gate-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .gate-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:40px 32px;
    max-width:420px;
    width:100%;
    box-shadow:0 1px 2px rgba(28,43,57,.04);
  }
  .gate-eyebrow{
    font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700;
    text-transform:uppercase;margin-bottom:10px;
  }
  .gate-title{font-size:24px;font-weight:700;margin-bottom:6px;}
  .gate-sub{font-size:13.5px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
  .role-buttons{display:flex;flex-direction:column;gap:10px;}
  .role-buttons button{padding:16px;font-size:15px;text-align:left;display:flex;justify-content:space-between;align-items:center;}
  .role-buttons button span.sub{display:block;font-weight:400;font-size:12px;margin-top:3px;opacity:.75;}

  .field-group{margin-bottom:16px;}
  .error-msg{color:var(--negative);font-size:13px;margin-top:10px;min-height:18px;}
  .back-link{font-size:13px;color:var(--muted);cursor:pointer;display:inline-block;margin-bottom:18px;}
  .back-link:hover{color:var(--ink);}

  /* --- ダッシュボード共通 --- */
  .topbar{
    background:var(--ink);color:#fff;
    padding:16px 24px;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;
  }
  .topbar .brand{font-family:'Zen Kaku Gothic New';font-weight:700;font-size:16px;}
  .topbar .who{font-size:12.5px;opacity:.75;margin-top:2px;}
  .topbar button{background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;padding:8px 14px;}
  .topbar button:hover{background:rgba(255,255,255,.22);}

  .container{max-width:1040px;margin:0 auto;padding:28px 20px 60px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:20px;
  }
  .card h2{font-size:16px;}
  .card .desc{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:180px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  tr.total-row td{background:var(--accent-soft);font-weight:700;border-bottom:2px solid var(--accent);}
  td.num, th.num{text-align:right;}
  tr:last-child td{border-bottom:none;}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge-pending{background:var(--warn-soft);color:var(--warn);}
  .badge-approved{background:var(--positive-soft);color:var(--positive);}
  .badge-rejected{background:var(--negative-soft);color:var(--negative);}

  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .label{font-size:12px;color:var(--muted);}
  .stat .value{font-size:22px;font-weight:600;font-family:'JetBrains Mono';}
  .stat .value.negative{color:var(--negative);}
  .stat .value.positive{color:var(--positive);}

  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{background:transparent;color:var(--muted);padding:9px 16px;border:1px solid transparent;font-size:13.5px;}
  .tabs button.active{background:var(--card);color:var(--ink);border-color:var(--border);}

  .form-inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:14px;}
  .form-inline > div{flex:1;min-width:140px;}
  .form-inline button{white-space:nowrap;}

  .empty{color:var(--muted);font-size:13px;padding:14px 0;}
  .muted{color:var(--muted);}
  .company-picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .company-picker > button{padding:8px 14px;font-size:13px;background:#fff;border:1px solid var(--border);color:var(--ink);}
  .company-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
  .company-select{
    flex:1;max-width:340px;
    font-weight:600;font-size:14.5px;
    padding:11px 12px;
  }
  .company-gear{padding:10px 13px;font-size:15px;line-height:1;}
  .company-chip{
    display:flex;align-items:center;gap:2px;
    background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;
  }
  .company-chip.active{background:var(--ink);border-color:var(--ink);}
  .company-chip.active .chip-label{color:#fff;}
  .company-chip .chip-label{padding:8px 10px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink);white-space:nowrap;}
  .company-chip .chip-arrow, .company-chip .chip-delete{
    background:transparent;border:none;color:var(--muted);padding:8px 7px;font-size:12px;border-radius:0;
  }
  .company-chip.active .chip-arrow{color:rgba(255,255,255,.7);}
  .company-chip .chip-arrow:hover{color:var(--ink);}
  .company-chip.active .chip-arrow:hover{color:#fff;}
  .company-chip .chip-delete:hover{color:var(--negative);}
  .row-delete{background:transparent;border:none;color:var(--muted);font-size:12px;padding:4px 8px;}
  .row-delete:hover{color:var(--negative);}

  .loss-expiry-warn{color:var(--warn);font-weight:700;}

  /* --- 口座管理タブ: コンパクトなツールバーとチャート --- */
  .chart-toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
  .chart-account-select{flex:1;max-width:300px;font-weight:600;}
  .period-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}
  .period-toggle button{
    background:#fff;color:var(--muted);border:none;border-radius:0;
    padding:9px 16px;font-size:13px;
  }
  .period-toggle button.active{background:var(--ink);color:#fff;}
  .chart-card h3{font-size:14.5px;margin-bottom:12px;}
  .chart-sub{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px;}
  .chart-box{position:relative;height:300px;}

  /* --- テーブルはカード内で横スクロール可能に --- */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* --- モバイル最適化 (iPhone等) --- */
  @media (max-width: 640px){
    .container{padding:16px 12px 48px;}
    .card{padding:16px 14px;margin-bottom:14px;border-radius:10px;}
    .topbar{padding:12px 14px;}
    .topbar .brand{font-size:14.5px;}
    .topbar button{padding:7px 10px;font-size:11.5px;}

    /* タブは折り返さず横スクロール */
    .tabs{
      flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      margin-bottom:14px;padding-bottom:4px;
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{display:none;}
    .tabs button{white-space:nowrap;padding:8px 13px;font-size:13px;flex-shrink:0;}

    .company-select{max-width:none;}

    /* テーブルを小さく詰めて、カード内で横スクロール */
    .card{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{font-size:12px;min-width:100%;}
    th,td{padding:7px 6px;white-space:nowrap;}

    .stat .value{font-size:18px;}
    .row{gap:10px;}
    .row > *{min-width:140px;}

    .form-inline{gap:8px;}
    .form-inline > div{min-width:100%;}
    .form-inline button{width:100%;}

    button{padding:10px 14px;}
    .btn-approve,.btn-reject{padding:6px 10px;font-size:12px;}
    .row-delete{font-size:11.5px;padding:3px 6px;}

    .gate-card{padding:28px 20px;}
    .wave{margin:18px 0;}

    /* 口座管理タブ */
    .chart-account-select{max-width:none;}
    .period-toggle button{padding:8px 13px;font-size:12.5px;}
    .chart-box{height:230px;}
    .chart-card{padding:14px 10px;}
    .chart-card h3{font-size:13.5px;margin-bottom:8px;padding-left:4px;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* =====================================================================
   Supabase 初期化
===================================================================== */
if(!window.SUPABASE_URL || window.SUPABASE_URL.includes("xxxx")){
  document.getElementById('app').innerHTML =
    '<div style="padding:40px;font-family:sans-serif;max-width:560px;margin:0 auto;">' +
    '<h2>config.js が未設定です</h2>' +
    '<p>config.example.js を config.js としてコピーし、SupabaseプロジェクトのURLとanon keyを設定してください。</p>' +
    '</div>';
  throw new Error("config.js not set");
}
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

/* =====================================================================
   グローバル状態
===================================================================== */
const state = {
  screen: 'loading',        // loading | gate | emp-pick | emp-pin | admin-pin | employee | admin
  companies: [],
  employees: [],
  selectedCompanyId: null,
  selectedEmployeeId: null,
  session: null,             // { role: 'employee'|'admin', employeeId }
  currentEmployee: null,     // 自分の社員情報(employeeログイン時)
  adminCompanyId: null,      // 管理者が見ている会社
  adminTab: 'accounts',
};

const app = document.getElementById('app');
const yen = n => (n===null||n===undefined) ? '—' : Number(n).toLocaleString('ja-JP') + '円';
const ym = d => { const dt=new Date(d); return `${dt.getFullYear()}年${dt.getMonth()+1}月`; };

function waveDivider(){
  return `<svg class="wave" viewBox="0 0 400 20" preserveAspectRatio="none">
    <path d="M0 10 Q 25 0, 50 10 T 100 10 T 150 10 T 200 10 T 250 10 T 300 10 T 350 10 T 400 10"
      fill="none" stroke="#2F7A6B" stroke-width="1.5"/>
  </svg>`;
}

/* =====================================================================
   認証（匿名サインイン）
===================================================================== */
async function ensureAnonSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) return session;
  const { data, error } = await sb.auth.signInAnonymously();
  if(error){
    console.error(error);
    alert("匿名サインインに失敗しました。Supabase の Authentication → Providers → Anonymous Sign-Ins が有効か確認してください。");
    throw error;
  }
  return data.session;
}

async function loadExistingAppSession(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return null;
  const { data, error } = await sb.from('app_sessions').select('*').eq('id', user.id).maybeSingle();
  if(error || !data) return null;
  return { role: data.role, employeeId: data.employee_id };
}

/* =====================================================================
   起動
===================================================================== */
async function boot(){
  await ensureAnonSession();
  const existing = await loadExistingAppSession();
  if(existing){
    state.session = existing;
    if(existing.role === 'admin'){
      await enterAdmin();
    } else {
      await enterEmployee(existing.employeeId);
    }
  } else {
    state.screen = 'gate';
    render();
  }
}

/* =====================================================================
   画面遷移: ゲート
===================================================================== */
function goGate(){ state.screen='gate'; render(); }

async function goEmployeePick(){
  const { data, error } = await sb.from('company_directory').select('*').order('display_order').order('name');
  state.companies = data || [];
  state.screen = 'emp-company';
  render();
}

async function selectCompanyForEmployee(companyId){
  state.selectedCompanyId = companyId;
  const { data } = await sb.from('employee_directory').select('*').eq('company_id', companyId).order('name');
  state.employees = data || [];
  state.screen = 'emp-name';
  render();
}

function selectEmployeeName(employeeId){
  state.selectedEmployeeId = employeeId;
  state.screen = 'emp-pin';
  render();
}

function goAdminPin(){ state.screen='admin-pin'; render(); }

/* =====================================================================
   PIN照合
===================================================================== */
async function submitEmployeePin(pin){
  const errEl = document.getElementById('pin-error');
  const { data, error } = await sb.rpc('verify_employee_pin', { pin, target_employee_id: state.selectedEmployeeId });
  if(error || !data){
    if(errEl) errEl.textContent = 'PINが違います。5回続けて間違えると15分間ログインできなくなります。';
    return;
  }
  await enterEmployee(state.selectedEmployeeId);
}

async function submitAdminPin(pin){
  const errEl = document.getElementById('pin-error');
  const { data, error } = await sb.rpc('verify_admin_pin', { pin });
  if(error || !data){
    if(errEl) errEl.textContent = 'PINが違います。もう一度お試しください。';
    return;
  }
  await enterAdmin();
}

async function logout(){
  await sb.auth.signOut();
  Object.assign(state, {
    screen:'gate', session:null, currentEmployee:null,
    selectedCompanyId:null, selectedEmployeeId:null, adminCompanyId:null
  });
  await ensureAnonSession();
  render();
}

/* =====================================================================
   社員ダッシュボード
===================================================================== */
async function enterEmployee(employeeId){
  const { data: emp } = await sb.from('employees').select('*').eq('id', employeeId).maybeSingle();
  // 上のクエリは admin 以外は RLS で弾かれる想定なので、employee_directory からも補完
  let empInfo = emp;
  if(!empInfo){
    const { data: dir } = await sb.from('employee_directory').select('*').eq('id', employeeId).maybeSingle();
    empInfo = dir;
  }
  state.currentEmployee = empInfo;
  state.session = { role:'employee', employeeId };
  state.screen = 'employee';
  render();
  loadEmployeeData();
}

async function loadEmployeeData(){
  const employeeId = state.session.employeeId;
  const { data: accounts } = await sb.from('trading_accounts').select('*').eq('employee_id', employeeId);
  state.myAccounts = accounts || [];

  state.myBalances = {};
  state.myCashflows = {};
  for(const acc of state.myAccounts){
    const { data: balances } = await sb.from('monthly_balances').select('*').eq('account_id', acc.id).order('year_month', {ascending:false});
    state.myBalances[acc.id] = balances || [];
    const { data: cfs } = await sb.from('account_cashflows').select('*').eq('account_id', acc.id).order('flow_date', {ascending:false});
    state.myCashflows[acc.id] = cfs || [];
  }

  const { data: annualExp } = await sb.from('annual_expenses').select('*').eq('employee_id', employeeId).order('fiscal_year_end', {ascending:false});
  state.myAnnualExpenses = annualExp || [];

  // 自分の会社の決算期(チャートの年次集計用)
  if(state.currentEmployee?.company_id){
    const { data: myCompany } = await sb.from('companies').select('*').eq('id', state.currentEmployee.company_id).maybeSingle();
    state.myCompanyFiscalMonth = myCompany?.fiscal_year_start_month || 4;
  } else {
    state.myCompanyFiscalMonth = 4;
  }

  const { data: ledger } = await sb.from('incentive_ledger').select('*').eq('employee_id', employeeId).order('created_at', {ascending:false});
  state.myIncentiveLedger = ledger || [];

  const { data: settlements } = await sb.from('annual_settlements').select('*').eq('employee_id', employeeId).order('fiscal_year_end', {ascending:false});
  state.mySettlements = settlements || [];

  const { data: salary } = await sb.rpc('get_my_salary');
  state.mySalary = salary ?? 0;

  renderEmployeeDashboard();
}

function incentiveBalance(ledgerEntries){
  return (ledgerEntries||[]).filter(e=>e.status==='completed').reduce((s,e)=>s+Number(e.amount),0);
}
function incentivePendingWithdrawals(ledgerEntries){
  return (ledgerEntries||[]).filter(e=>e.status==='pending' && e.entry_type==='withdrawal').reduce((s,e)=>s+Math.abs(Number(e.amount)),0);
}
function incentiveAvailable(ledgerEntries){
  return incentiveBalance(ledgerEntries) - incentivePendingWithdrawals(ledgerEntries);
}

/* ---------------------------------------------------------------------
   見込みインセンティブの自動計算(汎用)
   - 対象期間: 最後に確定した年次精算の期末翌日 〜 現在
     (確定精算がなければ、最初の残高記録の月から)
   - 給与コスト: 期間の経過月数 × 月給
   - 税は未確定要素のため見込みには含めない(注記で伝える)
   - DBには保存せず、常に最新の残高・入出金から算出するため、
     残高の修正・削除にも自動で追従する
--------------------------------------------------------------------- */
function estimateCurrentSettlement(accounts, balancesByAccount, cashflowsByAccount, monthlySalary, settlements, splitRate, employee){
  splitRate = splitRate ?? 0.5;
  const settled = (settlements||[]).slice().sort((a,b)=>b.fiscal_year_end.localeCompare(a.fiscal_year_end));
  const periodStart = settled.length ? settled[0].fiscal_year_end : null; // この日「まで」は精算済み

  // 期間開始: 精算済みならその期末、なければ最初の残高記録の月末
  // (最初の残高は元手=期首残高として扱い、投資収益に誤カウントしない)
  let startDate = periodStart;
  if(!startDate){
    let earliest = null;
    for(const acc of accounts){
      const bs = balancesByAccount[acc.id]||[];
      for(const b of bs){
        if(!earliest || b.year_month < earliest) earliest = b.year_month;
      }
    }
    if(!earliest) return null; // 残高データなし
    startDate = monthEndDate(earliest);
  }

  const today = new Date().toISOString().slice(0,10);

  let profit = 0;
  let hasData = false;
  for(const acc of accounts){
    const bs = balancesByAccount[acc.id]||[];
    const cfs = cashflowsByAccount[acc.id]||[];
    const within = bs.filter(b=>{
      const me = monthEndDate(b.year_month);
      return me > startDate && me <= today;
    });
    if(within.length) hasData = true;
    profit += accountProfitForPeriodGeneric(bs, cfs, startDate, today);
  }
  if(!hasData) return null;

  // 経過月数(開始月の翌月から現在の月まで)を、稼働開始月・稼働終了月で切り取る
  const now = new Date();
  const periodFrom = serialToYm(monthSerial(startDate) + 1);
  const periodTo   = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const months = activeMonthsInPeriod(employee, periodFrom, periodTo);
  const salaryCost = Number(monthlySalary||0) * months;

  const distributable = profit - salaryCost;
  const employeeAmount = distributable >= 0 ? distributable * splitRate : distributable;  // マイナスは全額社員負担

  return { startDate, months, profit, salaryCost, distributable, employeeAmount };
}

// accountProfitForPeriodの汎用版(state非依存で、任意のデータを渡せる)
function accountProfitForPeriodGeneric(balances, cashflows, startDate, endDate){
  const sorted = (balances||[]).slice().sort((a,b)=> a.year_month.localeCompare(b.year_month));
  const before = sorted.filter(b=>monthEndDate(b.year_month) <= startDate);
  const within = sorted.filter(b=>{
    const me = monthEndDate(b.year_month);
    return me > startDate && me <= endDate;
  });
  const startBalance = before.length ? Number(before[before.length-1].balance) : 0;
  const endBalance = within.length ? Number(within[within.length-1].balance) : startBalance;
  const cfs = (cashflows||[]).filter(cf => cf.flow_date > startDate && cf.flow_date <= endDate);
  const netCashflow = cfs.reduce((s,cf)=>s+Number(cf.amount), 0);
  return (endBalance - startBalance) - netCashflow;
}

async function downloadBackup(){
  const tables = [
    'companies','employees','trading_accounts','monthly_balances',

    'company_pl_summary','loss_carryforward_vintages','loss_carryforward_usages'

    if(error){ alert(`バックアップに失敗しました(${t}): ${error.message}`); return; }

  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);

/* ---------------------------------------------------------------------
   投資収益の計算（残高の増減 − 入出金）
   注意: 月次残高は「その月の1日」として保存されているが、意味としては
   「その月末時点の残高」を表す。比較の基準もすべて月末日にそろえることで、
   月の途中に発生した入出金が翌月分として誤集計されるのを防ぐ。
--------------------------------------------------------------------- */
function monthEndDate(yearMonthStr){
  const year = Number(yearMonthStr.slice(0,4));
  const month = Number(yearMonthStr.slice(5,7)); // 1-12
  const last = new Date(Date.UTC(year, month, 0)); // 翌月の0日目 = 当月末日
  return last.toISOString().slice(0,10);
}

}

/* ---------------------------------------------------------------------
   口座管理タブ用: 残高記録の間隔ごとに「その間の入出金」「投資収益」を算出
--------------------------------------------------------------------- */
function monthlySeriesForAccount(accountId, balancesMap, cashflowsMap){
  balancesMap = balancesMap || state.adminBalances || {};
  cashflowsMap = cashflowsMap || state.adminCashflows || {};
  const balances = (balancesMap[accountId]||[]).slice().sort((a,b)=>a.year_month.localeCompare(b.year_month));
  const cashflows = (cashflowsMap[accountId]||[]).slice().sort((a,b)=>a.flow_date.localeCompare(b.flow_date));
  const series = [];
  let prevBalance = null;
  let prevBoundary = null;
  balances.forEach(b => {
    const boundary = monthEndDate(b.year_month);
    const cfSum = cashflows
      .filter(cf => (!prevBoundary || cf.flow_date > prevBoundary) && cf.flow_date <= boundary)
      .reduce((s,cf)=>s+Number(cf.amount), 0);
    const profit = prevBalance===null ? null : (Number(b.balance) - prevBalance) - cfSum;
    series.push({ id: b.id, year_month: b.year_month, balance: Number(b.balance), cashflow: cfSum, profit });
    prevBalance = Number(b.balance);
    prevBoundary = boundary;
  });
  return series;
}

/* ---------------------------------------------------------------------
   年次精算の計算
   ---------------------------------------------------------------------
   ■ 課税所得のベース
     社員ごとに 投資収益 − 年間固定給 − 年度経費。
     年度経費は「会社負担」「インセンティブから控除」の両方を含める
     (どちらも会社が実際に支払った費用のため、税務上はどちらも損金)。

   ■ 法人税は会社全体で判定する
     会社課税ベース = 全社員の課税ベースの合計(赤字社員の損失も通算)
     欠損金の充当額 = min(max(0, 会社課税ベース), 繰越欠損金の残高)
     課税対象額     = max(0, 会社課税ベース − 充当額)
     法人税の合計   = 課税対象額 × 税率

   ■ 繰越欠損金を使い切る年の按分
     使い切る年は「利益の一部だけ」が課税対象になる。その法人税の合計額を、
     黒字社員の課税ベースの比率でそのまま比例配分する。端数は最後の黒字社員
     で吸収し、按分額の合計が法人税の合計と必ず1円単位で一致するようにする。
     赤字の社員には税を負担させない(その損失は会社全体の通算で既に効いている)。

   ■ 分配対象額 = 投資収益 − 年間報酬 − 会社負担経費 − 按分後の法人税
     会社負担経費(社会保険料の会社負担分など)は報酬と同じ性質のコストなので、
     50/50に分ける前に差し引く。結果として社員と会社が実質半分ずつ負担する。
     一方「インセンティブから控除」の経費はすでに incentive_ledger 側で
     社員の残高から全額引かれているため、ここで引くと二重に差し引かれてしまう。
     課税ベースの計算では両方の経費を引く(どちらも会社が支払った損金のため)。
--------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   稼働月数の計算
   ---------------------------------------------------------------------
   社員ごとに「稼働開始月」「稼働終了月」を持ち、報酬コストは
   月額 × その期間に実際に稼働していた月数 で計算する。
   開始月・終了月はどちらもその月を含む(入社した月から数える)。
   未設定の場合は期間全体を稼働扱いにするため、従来どおり満額になる。
--------------------------------------------------------------------- */
function monthSerial(dateStr){            // 'YYYY-MM' / 'YYYY-MM-DD' → 年*12+月
  if(!dateStr) return null;
  const y = Number(String(dateStr).slice(0,4));
  const m = Number(String(dateStr).slice(5,7));
  if(!y || !m) return null;
  return y * 12 + m;
}
function serialToYm(serial){              // 年*12+月 → 'YYYY-MM'
  const y = Math.floor((serial - 1) / 12);
  return `${y}-${String(serial - y*12).padStart(2,'0')}`;
}
function activeMonthsInPeriod(emp, periodStart, periodEnd){
  const from0 = monthSerial(periodStart);
  const to0   = monthSerial(periodEnd);
  if(from0 === null || to0 === null) return 0;
  const s = monthSerial(emp && emp.started_on);
  const e = monthSerial(emp && emp.ended_on);
  const from = (s !== null) ? Math.max(from0, s) : from0;
  const to   = (e !== null) ? Math.min(to0,   e) : to0;
  return Math.max(0, to - from + 1);
}

/* ---------------------------------------------------------------------
   法人税の計算（所得区分ごとの段階税率）
   ---------------------------------------------------------------------
   corporate_tax_brackets に「upper_limit までを rate で課税」という行を
   並べておき、課税所得を区分ごとに切って積み上げる（累進計算）。
   中小法人の初期値: 400万円以下 21.37% / 800万円以下 23.17% / 超 33.58%

   税率テーブルが未登録の場合は fallbackRate（従来の一律税率）で計算するため、
   マイグレーション前でも画面は壊れない。
--------------------------------------------------------------------- */
function computeCorporateTax(taxableIncome, brackets, fallbackRate){
  const income = Math.max(0, Number(taxableIncome) || 0);
  const rows = (brackets || []).slice().sort((a,b) => (a.sort_order||0) - (b.sort_order||0));

  // 税率テーブルが無ければ従来どおり一律税率
  if(!rows.length){
    const rate = Number(fallbackRate) || 0;
    return {
      total: Math.round(income * rate),
      breakdown: income > 0 ? [{ from: 0, to: Infinity, rate, part: income, amount: income * rate }] : [],
      nextThreshold: null, nextRate: null, configured: false,
    };
  }

  const breakdown = [];
  let lower = 0, total = 0;
  for(const b of rows){
    const upper = (b.upper_limit === null || b.upper_limit === undefined) ? Infinity : Number(b.upper_limit);
    if(income > lower){
      const part = Math.min(income, upper) - lower;
      if(part > 0){
        const rate = Number(b.rate) || 0;
        breakdown.push({ from: lower, to: upper, rate, part, amount: part * rate });
        total += part * rate;
      }
    }
    lower = upper;
    if(!isFinite(upper)) break;
  }

  // 次に税率が変わる金額（いくら増えると区分が上がるか）
  let nextThreshold = null, nextRate = null;
  for(let i = 0; i < rows.length; i++){
    const upper = (rows[i].upper_limit === null || rows[i].upper_limit === undefined) ? Infinity : Number(rows[i].upper_limit);
    if(isFinite(upper) && income < upper){
      nextThreshold = upper;
      nextRate = rows[i+1] ? Number(rows[i+1].rate) : null;
      break;
    }
  }

  return { total: Math.round(total), breakdown, nextThreshold, nextRate, configured: true };
}

function annualExpenseTotalFor(employeeId, fiscalYearEnd, fundedBy){
  return (state.adminAnnualExpenses||[])
    .filter(e => e.employee_id === employeeId && e.fiscal_year_end === fiscalYearEnd
                 && (!fundedBy || e.funded_by === fundedBy))
    .reduce((s,e) => s + Number(e.amount||0), 0);
}

function computeYearSettlement(f){
  const employees = state.adminEmployees || [];
  const taxRate = Number(f.taxRate)||0;
  const splitRate = Number(f.splitRate)||0;

  // 期首残高 = 年度開始日の前日(=前年度末)時点の残高
  const rows = employees.map(emp => {
    const profit = employeeInvestmentProfit(emp.id, addDaysStr(f.start,-1), f.end);
    const activeMonths = activeMonthsInPeriod(emp, f.start, f.end);              // 稼働していた月数
    const salaryCost = Number(emp.monthly_salary||0) * activeMonths;
    const expenseCost        = annualExpenseTotalFor(emp.id, f.end);              // 課税ベース用(全額)
    const companyExpenseCost = annualExpenseTotalFor(emp.id, f.end, 'company');   // 分配前に引く分
    return { emp, profit, activeMonths, salaryCost, expenseCost, companyExpenseCost,
             taxBase: profit - salaryCost - expenseCost };
  });

  const companyTaxBase = rows.reduce((s,r) => s + r.taxBase, 0);
  const isFinal = (f.taxSource === 'final');

  /* ------------------------------------------------------------------
     決算確定値モード
     ------------------------------------------------------------------
     このアプリはトレード部分しか把握していないため、不動産賃料などが
     あると正しい課税所得も税率区分も分からない。決算が終わったら
     決算書の実額から「トレード分の税額」を按分で切り出す。

       トレード分の税額 = 法人税等(実額) × (トレードの課税ベース ÷ 会社全体の所得)

     分母は繰越欠損金を控除する前の所得金額。トレードの課税ベースも控除前の
     数字なので基準がそろう。繰越欠損金はこのモードでは自動消し込みしない
     （別表七の残高を「繰越欠損金」タブで直接更新する運用）。
  ------------------------------------------------------------------ */
  const pl = (state.adminPL || []).find(p => p.fiscal_year_end === f.end) || null;
  const companyIncome    = pl ? Number(pl.taxable_income_before_loss) : null;
  const companyTaxActual = pl ? Number(pl.tax_amount) : null;
  const finalReady = isFinal
    && companyIncome !== null && !isNaN(companyIncome)
    && companyTaxActual !== null && !isNaN(companyTaxActual);
  const tradeRatio = (finalReady && companyIncome > 0)
    ? Math.min(1, Math.max(0, companyTaxBase / companyIncome)) : 0;

  const lossAvailable  = Math.max(0, Number(f.lossAvailable)||0);
  const lossUsed       = isFinal ? 0 : Math.min(Math.max(0, companyTaxBase), lossAvailable);
  const taxableIncome  = isFinal ? Math.max(0, companyTaxBase) : Math.max(0, companyTaxBase - lossUsed);
  const taxableRatio   = companyTaxBase > 0 ? (taxableIncome / companyTaxBase) : 0;

  // 段階税率での自動計算（見込み用）。手入力があればそれを優先する
  const tax = computeCorporateTax(isFinal ? 0 : taxableIncome, state.adminTaxBrackets, taxRate);
  const hasOverride = f.taxOverride !== null && f.taxOverride !== undefined && f.taxOverride !== '';
  const autoTax = isFinal ? Math.round((companyTaxActual||0) * tradeRatio) : tax.total;
  const totalTax = hasOverride ? Math.max(0, Math.round(Number(f.taxOverride)||0)) : autoTax;
  const effectiveRate = taxableIncome > 0 ? (totalTax / taxableIncome) : 0;

  // 法人税の合計を黒字社員の課税ベース比率で按分(端数は最後の黒字社員に寄せる)
  const positiveRows = rows.filter(r => r.taxBase > 0);
  const positiveBaseTotal = positiveRows.reduce((s,r) => s + r.taxBase, 0);
  rows.forEach(r => { r.taxCost = 0; });
  let allocated = 0;
  positiveRows.forEach((r, i) => {
    if(positiveBaseTotal <= 0) return;
    const isLast = (i === positiveRows.length - 1);
    r.taxCost = isLast ? (totalTax - allocated) : Math.round(totalTax * (r.taxBase / positiveBaseTotal));
    allocated += r.taxCost;
  });

  rows.forEach(r => {
    // 円未満が残らないよう、社員取り分を丸めてから会社取り分を差額で出す
    // (こうしないと 社員取り分 + 会社取り分 が分配対象額と1円ずれることがある)
    r.distributable   = Math.round(r.profit - r.salaryCost - r.companyExpenseCost - r.taxCost);
    r.employeeAmount  = r.distributable >= 0 ? Math.round(r.distributable * splitRate) : r.distributable; // マイナスは全額社員負担
    r.companyShare    = r.distributable >= 0 ? (r.distributable - r.employeeAmount) : 0;
    r.already         = (state.adminSettlements||[]).find(s => s.employee_id === r.emp.id && s.fiscal_year_end === f.end) || null;
  });

  return { rows, companyTaxBase, lossAvailable, lossUsed, taxableIncome, taxableRatio,
           totalTax, autoTax, hasOverride, effectiveRate,
           isFinal, finalReady, companyIncome, companyTaxActual, tradeRatio, hasPL: !!pl,
           breakdown: tax.breakdown, nextThreshold: tax.nextThreshold, nextRate: tax.nextRate,
           bracketsConfigured: tax.configured, taxRate, splitRate };
}

/* ---------------------------------------------------------------------
   今期の見込み(未確定)を会社全体で計算する ─ 管理者画面用
   ---------------------------------------------------------------------
   社員ごとの estimateCurrentSettlement() に、まだ精算していない年度の経費と
   法人税の按分を上乗せしたもの。税額の出し方は確定時と同じ考え方で、
   繰越欠損金は「繰越欠損金」タブの現在の登録残高を使う。
   ※ 社員画面の見込みは会社全体のデータを持たないため、従来どおり税抜きのまま。
--------------------------------------------------------------------- */
function estimateCurrentSettlementAll(splitRate){
  splitRate = splitRate ?? 0.5;
  const taxRate = Number(state.settlementForm?.taxRate) || 0.30;
  const lossAvailable = (state.adminLoss||[]).reduce((s,l)=> s + Number(l.remaining_amount||0), 0);

  const rows = (state.adminEmployees||[]).map(emp => {
    const accounts    = (state.adminAccounts||[]).filter(a => a.employee_id === emp.id);
    const settlements = (state.adminSettlements||[]).filter(s => s.employee_id === emp.id);
    const est = estimateCurrentSettlement(accounts, state.adminBalances||{}, state.adminCashflows||{},
                                          emp.monthly_salary, settlements, splitRate, emp);
    if(!est) return { emp, est: null, expenseCost: 0, companyExpenseCost: 0, taxBase: 0, taxCost: 0 };
    // まだ精算していない年度(= 見込み期間の開始日より後に期末を迎える年度)の経費
    const unsettled = (state.adminAnnualExpenses||[])
      .filter(e => e.employee_id === emp.id && String(e.fiscal_year_end) > est.startDate);
    const expenseCost        = unsettled.reduce((s,e) => s + Number(e.amount||0), 0);
    const companyExpenseCost = unsettled.filter(e => e.funded_by === 'company')
                                        .reduce((s,e) => s + Number(e.amount||0), 0);
    return { emp, est, expenseCost, companyExpenseCost,
             taxBase: est.profit - est.salaryCost - expenseCost, taxCost: 0 };
  });

  const active = rows.filter(r => r.est);
  const companyTaxBase = active.reduce((s,r) => s + r.taxBase, 0);
  const lossUsed       = Math.min(Math.max(0, companyTaxBase), lossAvailable);
  const taxableIncome  = Math.max(0, companyTaxBase - lossUsed);
  const totalTax       = computeCorporateTax(taxableIncome, state.adminTaxBrackets, taxRate).total;

  const positiveRows = active.filter(r => r.taxBase > 0);
  const positiveBaseTotal = positiveRows.reduce((s,r) => s + r.taxBase, 0);
  let allocated = 0;
  positiveRows.forEach((r, i) => {
    if(positiveBaseTotal <= 0) return;
    const isLast = (i === positiveRows.length - 1);
    r.taxCost = isLast ? (totalTax - allocated) : Math.round(totalTax * (r.taxBase / positiveBaseTotal));
    allocated += r.taxCost;
  });

  active.forEach(r => {
    r.distributable  = Math.round(r.est.profit - r.est.salaryCost - r.companyExpenseCost - r.taxCost);
    r.employeeAmount = r.distributable >= 0 ? Math.round(r.distributable * splitRate) : r.distributable;
    r.companyShare   = r.distributable >= 0 ? (r.distributable - r.employeeAmount) : 0;
  });

  return { rows, companyTaxBase, lossAvailable, lossUsed, taxableIncome, totalTax, taxRate };
}

/* ---------------------------------------------------------------------
   年次精算の確定(年度単位で全社員をまとめて保存)
   繰越欠損金は会社単位で消し込むため、社員ごとに確定すると二重に減ってしまう。
   そのため確定は年度単位の一括処理にしている。
--------------------------------------------------------------------- */
async function confirmYearSettlement(isRevision){
  const f = state.settlementForm;
  if(!f) return;
  const calc = computeYearSettlement(f);
  const targets = isRevision ? calc.rows : calc.rows.filter(r => !r.already);
  if(!targets.length){ alert('対象の社員がいません。'); return; }

  // 修正の場合は、前回確定した社員取り分との差額だけをインセンティブに反映する
  const prevOf = r => (r.already ? Number(r.already.employee_settlement_amount || 0) : 0);
  const detail = targets.map(r => isRevision
    ? `  ${r.emp.name}: ${yen(Math.round(prevOf(r)))} → ${yen(Math.round(r.employeeAmount))}（差額 ${r.employeeAmount - prevOf(r) >= 0 ? '+' : ''}${yen(Math.round(r.employeeAmount - prevOf(r)))}）`
    : `  ${r.emp.name}: ${yen(Math.round(r.employeeAmount))}`
  ).join('\n');

  const ok = confirm(
    `${f.start} 〜 ${f.end} の年次精算を${isRevision ? '修正' : '確定'}します。\n\n` +
    `会社の課税ベース合計: ${yen(Math.round(calc.companyTaxBase))}\n` +
    `繰越欠損金の充当額: ${yen(Math.round(calc.lossUsed))}\n` +
    `課税対象額: ${yen(Math.round(calc.taxableIncome))}\n` +
    `法人税の合計: ${yen(calc.totalTax)}${calc.hasOverride ? '（手入力）' : ''}\n\n` +
    `社員取り分:\n${detail}\n\n` +
    (isRevision
      ? `この年度の繰越欠損金の消し込みは、いったん取り消してから計算し直します。\nインセンティブ台帳には差額の調整だけが追加されます。よろしいですか？`
      : `繰越欠損金は発生年度の古いものから自動で消し込まれます。よろしいですか？`)
  );
  if(!ok) return;

  const { data:{ user } } = await sb.auth.getUser();

  // 修正時はまず、この年度の繰越欠損金の消し込みを巻き戻す
  if(isRevision){
    const reversed = await reverseLossCarryforward(f.end);
    if(!reversed) return;
  }

  for(const r of targets){
    const { data: settlement, error } = await sb.from('annual_settlements').upsert({
      employee_id: r.emp.id,
      company_id: state.adminCompanyId,
      fiscal_year_start: f.start,
      fiscal_year_end: f.end,
      investment_profit: r.profit,
      salary_cost: r.salaryCost,
      expense_cost: r.expenseCost,
      company_expense_cost: r.companyExpenseCost,
      tax_base: r.taxBase,
      company_tax_base: calc.companyTaxBase,
      loss_used_total: calc.lossUsed,
      taxable_ratio: calc.taxableRatio,
      company_tax_active: calc.totalTax > 0,
      tax_rate_used: calc.effectiveRate,
      tax_total_override: calc.hasOverride ? calc.totalTax : null,
      tax_note: (f.taxNote || null),
      tax_source: calc.isFinal ? 'final' : 'estimate',
      company_taxable_income: calc.isFinal ? calc.companyIncome : null,
      company_tax_actual: calc.isFinal ? calc.companyTaxActual : null,
      trade_share_ratio: calc.isFinal ? calc.tradeRatio : null,
      tax_cost: r.taxCost,
      distributable: r.distributable,
      split_rate: calc.splitRate,
      employee_settlement_amount: r.employeeAmount,
      company_share: r.companyShare,
      revised_at: (isRevision ? new Date().toISOString() : null),
      created_by: user.id
    }, { onConflict: 'employee_id,fiscal_year_end' }).select().single();

    if(error){ alert(`${r.emp.name} の精算保存に失敗しました: ${error.message}`); return; }

    // 新規は取り分をそのまま、修正は前回との差額だけを台帳に追加する
    const amount = isRevision ? (r.employeeAmount - prevOf(r)) : r.employeeAmount;
    if(amount !== 0){
      await sb.from('incentive_ledger').insert({
        employee_id: r.emp.id,
        entry_type: 'annual_settlement',
        amount,
        status: 'completed',
        related_settlement_id: settlement.id,
        note: isRevision
          ? `${f.start} 〜 ${f.end} の年次精算の修正` + (f.taxNote ? `（${f.taxNote}）` : '')
          : `${f.start} 〜 ${f.end} の年次精算`
      });
    }
  }

  if(!calc.isFinal){
    await consumeLossCarryforward(calc.lossUsed, f.end);
  }
  loadAdminData();
}

/* ---------------------------------------------------------------------
   繰越欠損金の消し込みを年度単位で巻き戻す（精算を修正するとき用）
   loss_carryforward_usages に「どの発生年度をいくら使ったか」を残しているので、
   それを逆に足し戻して履歴を削除する。
--------------------------------------------------------------------- */
async function reverseLossCarryforward(fiscalYearEnd){
  const usages = (state.adminLossUsages||[]).filter(u => u.fiscal_year_end === fiscalYearEnd);
  for(const u of usages){
    const v = (state.adminLoss||[]).find(l => l.id === u.vintage_id);
    if(v){
      const used      = Math.max(0, Number(v.used_amount||0) - Number(u.amount||0));
      const remaining = Number(v.remaining_amount||0) + Number(u.amount||0);
      const { error } = await sb.from('loss_carryforward_vintages')
        .update({ used_amount: used, remaining_amount: remaining }).eq('id', v.id);
      if(error){ alert('繰越欠損金の巻き戻しに失敗しました: '+error.message); return false; }
      v.used_amount = used;            // 直後の消し込み計算がこの値を見るのでローカルも更新
      v.remaining_amount = remaining;
    }
    const { error: delErr } = await sb.from('loss_carryforward_usages').delete().eq('id', u.id);
    if(delErr){ alert('消し込み履歴の削除に失敗しました: '+delErr.message); return false; }
  }
  state.adminLossUsages = (state.adminLossUsages||[]).filter(u => u.fiscal_year_end !== fiscalYearEnd);
  return true;
}

/* 繰越欠損金を発生年度の古いものから順に消し込む(先入先出) */
async function consumeLossCarryforward(amount, fiscalYearEnd){
  let remaining = Math.round(Number(amount)||0);
  if(remaining <= 0) return;

  const vintages = (state.adminLoss||[])
    .filter(l => Number(l.remaining_amount||0) > 0)
    .slice()
    .sort((a,b) => String(a.fiscal_year_end).localeCompare(String(b.fiscal_year_end))); // 古い年度から

  for(const v of vintages){
    if(remaining <= 0) break;
    const avail = Number(v.remaining_amount||0);
    const use = Math.min(avail, remaining);

    const { error } = await sb.from('loss_carryforward_vintages').update({
      used_amount: Number(v.used_amount||0) + use,
      remaining_amount: avail - use
    }).eq('id', v.id);
    if(error){ alert('繰越欠損金の更新に失敗しました: '+error.message); return; }

    await sb.from('loss_carryforward_usages').insert({
      company_id: state.adminCompanyId,
      vintage_id: v.id,
      fiscal_year_end: fiscalYearEnd,
      amount: use
    });

    remaining -= use;
  }

  if(remaining > 0){
    alert(`繰越欠損金の登録残高が不足していたため、${yen(remaining)} 分は消し込めませんでした。「繰越欠損金」タブの登録内容を確認してください。`);
  }
}

async function adminSetEmployeePin(employeeId, name){
  const el = document.getElementById('setpin-' + employeeId);
  const pin = (el?.value || '').trim();

/* 年次集計: monthlySeriesを会社の期首月で年度グルーピング */
function yearlySeriesForAccount(accountId, balancesMap, cashflowsMap, fsmOverride){
  const company = state.companies.find(c=>c.id===state.adminCompanyId);
  const fsm = fsmOverride || company?.fiscal_year_start_month || 4;
  const monthly = monthlySeriesForAccount(accountId, balancesMap, cashflowsMap);
  const groups = {};
  monthly.forEach(s => {
    const y = Number(s.year_month.slice(0,4));
    const m = Number(s.year_month.slice(5,7));
    const fiscalStartYear = m >= fsm ? y : y - 1;
    if(!groups[fiscalStartYear]) groups[fiscalStartYear] = { items: [] };
    groups[fiscalStartYear].items.push(s);
  });
  return Object.keys(groups).sort().map(fy => {
    const items = groups[fy].items;
    const last = items[items.length-1];
    const cashflow = items.reduce((s,i)=>s+i.cashflow,0);
    const profit = items.reduce((s,i)=> i.profit==null ? s : s+i.profit, 0);
    const endMonth = fsm === 1 ? 12 : fsm - 1;
    const endYear = fsm === 1 ? Number(fy) : Number(fy)+1;
    return {
      label: `${fy}/${fsm}〜${endYear}/${endMonth}期`,
      balance: last.balance,   // 年度末(最新)残高
      cashflow, profit
    };
  });
}

function chartSeries(ctx){
  // ctx未指定 = 管理者画面 / ctx指定 = 社員画面
  const accountId = ctx ? ctx.accountId : state.selectedChartAccountId;
  const balancesMap = ctx ? ctx.balancesMap : undefined;
  const cashflowsMap = ctx ? ctx.cashflowsMap : undefined;
  const fsm = ctx ? ctx.fsm : undefined;
  const period = (ctx ? ctx.period : state.chartPeriod) || 'monthly';
  if(period === 'yearly'){
    return yearlySeriesForAccount(accountId, balancesMap, cashflowsMap, fsm).map(s=>({ ...s }));
  }
  return monthlySeriesForAccount(accountId, balancesMap, cashflowsMap).map(s=>({ ...s, label: ym(s.year_month) }));
}

/* 金額の軸ラベルを「万」単位で短縮 */
function yenShort(v){
  const n = Number(v);
  if(Math.abs(n) >= 100000000) return (n/100000000).toLocaleString('ja-JP', {maximumFractionDigits:1}) + '億';
  if(Math.abs(n) >= 10000) return (n/10000).toLocaleString('ja-JP', {maximumFractionDigits:0}) + '万';
  return n.toLocaleString('ja-JP');
}

function drawAccountCharts(ctx){
  if(!window.Chart) return;
  const series = chartSeries(ctx);
  const labels = series.map(s=>s.label);
  const isMobile = window.innerWidth <= 640;
  const prefix = (ctx && ctx.keyPrefix) || 'admin';
  const balanceCanvasId = (ctx && ctx.balanceCanvasId) || 'balance-chart';
  const profitCanvasId = (ctx && ctx.profitCanvasId) || 'profit-chart';

  state.charts = state.charts || {};
  const bKey = prefix + '-balance', pKey = prefix + '-profit';
  if(state.charts[bKey]){ state.charts[bKey].destroy(); state.charts[bKey] = null; }
  if(state.charts[pKey]){ state.charts[pKey].destroy(); state.charts[pKey] = null; }

  const commonTicks = {
    font: { size: isMobile ? 10 : 12 },
  };
  const xTicks = {
    ...commonTicks,
    autoSkip: true,
    maxTicksLimit: isMobile ? 6 : 12,
    maxRotation: isMobile ? 45 : 0,
  };

  const balanceCanvas = document.getElementById(balanceCanvasId);
  if(balanceCanvas){
    state.charts[bKey] = new Chart(balanceCanvas, {
      data: {
        labels,
        datasets: [
          {
            type:'bar', label:'入出金', data: series.map(s=>s.cashflow),
            backgroundColor: series.map(s=> s.cashflow<0 ? 'rgba(180,83,61,0.6)' : 'rgba(63,143,95,0.6)'),
            yAxisID:'y1', order:2
          },
          {
            type:'line', label:'残高', data: series.map(s=>s.balance),
            borderColor:'#1C2B39', backgroundColor:'#1C2B39',
            pointRadius: isMobile ? 2.5 : 3, borderWidth: isMobile ? 2 : 3, tension:0.25,
            yAxisID:'y', order:1
          }
        ]
      },
      options: {
        responsive:true,
        maintainAspectRatio:false,
        interaction:{ mode:'index', intersect:false },
        scales: {
          x: { ticks: xTicks, grid:{ display:false } },
          y: { position:'left', ticks:{ ...commonTicks, callback:yenShort, maxTicksLimit: isMobile ? 5 : 8 } },
          y1:{ position:'right', grid:{ drawOnChartArea:false }, ticks:{ ...commonTicks, callback:yenShort, maxTicksLimit: isMobile ? 4 : 6 } }
        },
        plugins: {
          legend:{ position:'bottom', labels:{ font:{ size: isMobile ? 11 : 12 }, boxWidth: 14 } },
          tooltip:{ callbacks:{ label: ctx => `${ctx.dataset.label}: ${yen(ctx.raw)}` } }
        }
      }
    });
  }

  const profitCanvas = document.getElementById(profitCanvasId);
  if(profitCanvas){
    state.charts[pKey] = new Chart(profitCanvas, {
      type:'bar',
      data: {
        labels,
        datasets: [{
          label:'投資収益',
          data: series.map(s=>s.profit),
          backgroundColor: series.map(s => (s.profit||0) < 0 ? '#B4533D' : '#2F7A6B')
        }]
      },
      options: {
        responsive:true,
        maintainAspectRatio:false,
        scales: {
          x: { ticks: xTicks, grid:{ display:false } },
          y: { ticks:{ ...commonTicks, callback:yenShort, maxTicksLimit: isMobile ? 5 : 8 } }
        },
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label: ctx => `投資収益: ${yen(ctx.raw)}` } }
        }
      }
    });
  }
}

async function addAnnualExpense(){
  const employeeId = document.getElementById('ae-emp').value;
  const fiscalYearEnd = document.getElementById('ae-year').value;
  const amount = Number(document.getElementById('ae-amount').value);
  const fundedBy = document.getElementById('ae-funded').value;
  const note = document.getElementById('ae-note').value || null;
  if(!employeeId || !fiscalYearEnd || !amount){ alert('社員・年度・金額を入力してください'); return; }

  if(fundedBy === 'incentive'){
    const available = incentiveAvailable(employeeIncentiveLedger(employeeId));
    if(amount > available && !confirm(`インセンティブ残高(利用可能: ${yen(available)})を超えていますが、登録しますか？(残高がマイナスになります)`)) return;
  }

  const { data:{ user } } = await sb.auth.getUser();

  let ledgerEntryId = null;
  if(fundedBy === 'incentive'){
    const { data: le, error: lerr } = await sb.from('incentive_ledger').insert({
      employee_id: employeeId, entry_type: 'expense_payment',
      amount: -Math.abs(amount), status: 'completed',
      note: `〜${fiscalYearEnd} 年度経費合計` + (note ? `: ${note}` : ''),
      created_by: user.id
    }).select().single();
    if(lerr){ alert('インセンティブ控除の記録に失敗しました: '+lerr.message); return; }
    ledgerEntryId = le.id;
  }

  const { error } = await sb.from('annual_expenses').insert({
    employee_id: employeeId, fiscal_year_end: fiscalYearEnd,
    amount, funded_by: fundedBy, ledger_entry_id: ledgerEntryId, note, created_by: user.id
  });
  if(error){ alert('登録に失敗しました: '+error.message); return; }
  loadAdminData();
}

async function deleteAnnualExpense(id){
  const rec = (state.adminAnnualExpenses||[]).find(e=>e.id===id);
  if(!rec) return;
  if(!confirm('この年度経費の記録を削除します。インセンティブから控除されていた場合、その控除も取り消されます。よろしいですか？')) return;
  if(rec.ledger_entry_id){
    await sb.from('incentive_ledger').delete().eq('id', rec.ledger_entry_id);
  }
  const { error } = await sb.from('annual_expenses').delete().eq('id', id);
  if(error){ alert('削除に失敗しました: '+error.message); return; }
  loadAdminData();
}

/* 会社の期首月から、選択可能な年度リストを生成 */
function fiscalYearOptions(fiscalStartMonth, count){
  count = count || 6;
  const options = [];
  const now = new Date();
  // 現在進行中の年度の期首年を求める
  let startYear = now.getFullYear();
  if(now.getMonth()+1 < fiscalStartMonth) startYear -= 1;
  for(let i=0; i<count; i++){
    const y = startYear - i;
    const start = `${y}-${String(fiscalStartMonth).padStart(2,'0')}-01`;
    const endMonth = fiscalStartMonth === 1 ? 12 : fiscalStartMonth - 1;
    const endYear = fiscalStartMonth === 1 ? y : y + 1;
    const end = monthEndDate(`${endYear}-${String(endMonth).padStart(2,'0')}`);
    const isCurrent = i === 0;
    options.push({ start, end, isCurrent,
      label: `${y}年${fiscalStartMonth}月 〜 ${endYear}年${endMonth}月${isCurrent?'(進行中)':''}` });
  }
  return options;
}

function adminSettlementHtml(){
  const company = state.companies.find(c=>c.id===state.adminCompanyId);
  const fiscalStartMonth = company?.fiscal_year_start_month || 4;
  const years = fiscalYearOptions(fiscalStartMonth);

  if(!state.settlementForm || state.settlementForm.companyId !== state.adminCompanyId){
    // 会社を切り替えたら、その会社の「直近の完了した年度」をデフォルト選択
    const defaultYear = years.find(y=>!y.isCurrent) || years[0];
    state.settlementForm = {
      companyId: state.adminCompanyId,
      start: defaultYear.start,
      end: defaultYear.end,
      taxRate: 0.30,       // 税率テーブル未登録のときのフォールバック
      splitRate: 0.5,
      lossOverride: null,  // null なら「繰越欠損金」タブの登録残高をそのまま使う
      taxOverride: null,   // null なら自動計算
      taxNote: '',
      taxSource: 'estimate',  // estimate = アプリの段階税率 / final = 決算書の実額から按分
    };
  }
  const f = state.settlementForm;

  const yearOptions = years.map(y =>
    `<option value="${y.start}|${y.end}" ${y.start===f.start?'selected':''}>${y.label}</option>`
  ).join('');

  const currentLoss = (state.adminLoss||[]).reduce((s,l)=>s+Number(l.remaining_amount||0),0);
  // この年度ですでに消し込んだ分は、修正時に巻き戻すので使える側に戻して考える
  const usedThisYear = (state.adminLossUsages||[])
    .filter(u => u.fiscal_year_end === f.end)
    .reduce((s,u)=> s + Number(u.amount||0), 0);
  const registeredLoss = currentLoss + usedThisYear;
  f.lossAvailable = (f.lossOverride === null || f.lossOverride === undefined) ? registeredLoss : f.lossOverride;

  const selectedYear = years.find(y=>y.start===f.start);
  const isCurrentYear = selectedYear?.isCurrent;

  const calc = computeYearSettlement(f);
  const allSettled = calc.rows.length > 0 && calc.rows.every(r => r.already);
  const ratioPct = (calc.taxableRatio * 100).toFixed(1);

  // 課税状況の説明文
  let taxNote;
  if(calc.isFinal){
    if(!calc.hasPL){
      taxNote = `<strong style="color:var(--warn)">この年度の簡易PLが未登録です。</strong>「簡易PL」タブで、決算書の「所得金額(繰越欠損金の控除前)」と「法人税等(実績)」を登録してください。`;
    } else if(!calc.finalReady){
      taxNote = `<strong style="color:var(--warn)">簡易PLに必要な数字が足りません。</strong>「簡易PL」タブで、この年度の「所得金額(繰越欠損金の控除前)」と「法人税等(実績)」の両方を登録してください。`;
    } else if(calc.companyIncome <= 0){
      taxNote = `決算書の所得金額が ${yen(Math.round(calc.companyIncome))} のため、トレード分に配分する法人税はありません。`;
    } else {
      taxNote = `決算書の法人税等 <strong>${yen(Math.round(calc.companyTaxActual))}</strong> のうち、会社全体の所得 ${yen(Math.round(calc.companyIncome))} に対するトレードの課税ベース ${yen(Math.round(calc.companyTaxBase))} の割合(<strong>${(calc.tradeRatio*100).toFixed(2)}%</strong>)を掛けた <strong>${yen(calc.totalTax)}</strong> をトレード分の税額としています。賃料など他の収益で税率区分が上がった影響も、繰越欠損金が実際にどれだけ使われたかも、この実額にすでに含まれています。`;
    }
  } else if(calc.companyTaxBase <= 0){
    taxNote = 'この年度は会社全体の課税ベースがマイナスのため、法人税は発生しません。';
  } else if(calc.taxableIncome <= 0){
    taxNote = `課税ベース ${yen(Math.round(calc.companyTaxBase))} は繰越欠損金で全額相殺できるため、法人税は発生しません。`;
  } else if(calc.lossUsed > 0){
    taxNote = `<strong>繰越欠損金を使い切る年度です。</strong>課税ベース ${yen(Math.round(calc.companyTaxBase))} のうち ${yen(Math.round(calc.lossUsed))} を欠損金で相殺し、残りの ${yen(Math.round(calc.taxableIncome))}(全体の ${ratioPct}%)だけが課税対象になります。法人税 ${yen(calc.totalTax)} は、各社員の課税ベースの比率でそのまま按分されます。`;
  } else {
    taxNote = '使える繰越欠損金がないため、課税ベースの全額が課税対象になります。';
  }

  const rows = calc.rows.map(r => `
    <div class="card">
      <h3 style="margin-bottom:14px;">${r.emp.name}${r.already?' <span class="badge badge-approved">記録済み</span>':''}</h3>
      <div class="row">
        <div class="stat"><div class="label">投資収益(入出金調整後)</div><div class="value ${r.profit<0?'negative':'positive'}">${yen(Math.round(r.profit))}</div></div>
        <div class="stat"><div class="label">報酬(${r.activeMonths}ヶ月分)</div><div class="value">${yen(Math.round(r.salaryCost))}</div></div>
        <div class="stat"><div class="label">年度経費<span class="muted" style="font-size:12px;font-weight:400;">(うち会社負担 ${yen(Math.round(r.companyExpenseCost))})</span></div><div class="value">${yen(Math.round(r.expenseCost))}</div></div>
      </div>
      <div class="row" style="margin-top:14px;">
        <div class="stat"><div class="label">課税ベース(収益−報酬−経費)</div><div class="value ${r.taxBase<0?'negative':'positive'}">${yen(Math.round(r.taxBase))}</div></div>
        <div class="stat"><div class="label">法人税相当額(按分)</div><div class="value">${yen(r.taxCost)}${(calc.totalTax>0 && r.taxBase>0)?`<span class="muted" style="font-size:12px;font-weight:400;"> / 全体の${((r.taxCost/calc.totalTax)*100).toFixed(1)}%</span>`:''}</div></div>
        <div class="stat"><div class="label">分配対象額</div><div class="value ${r.distributable<0?'negative':'positive'}">${yen(Math.round(r.distributable))}</div></div>

        <div class="stat"><div class="label">会社取り分</div><div class="value">${yen(Math.round(r.companyShare))}</div></div>
      </div>
    </div>`

                 : allSettled ? 'この年度を修正して差額をインセンティブに反映'

  // 税額の内訳
  const breakdownRows = calc.breakdown.map(b => `<tr>
    <td>${yen(Math.round(b.from))} 〜 ${isFinite(b.to) ? yen(Math.round(b.to)) : '上限なし'}</td>
    <td class="num">${yen(Math.round(b.part))}</td>
    <td class="num">${(b.rate*100).toFixed(2)}%</td>
    <td class="num">${yen(Math.round(b.amount))}</td>
  </tr>`).join('') || `<tr><td colspan="4" class="empty">課税対象額がないため税額は発生しません</td></tr>`;

  // 次に税率が変わる金額まであといくらか
  const toNext = (calc.nextThreshold !== null && calc.taxableIncome > 0)

  const nearThreshold = toNext !== null && toNext <= 1000000;
  const thresholdNote = toNext === null ? '' : `

      ${nearThreshold?'⚠︎ ':''}課税対象額があと <strong>${yen(Math.round(toNext))}</strong> 増えると、
      ${yen(Math.round(calc.nextThreshold))} を超えて税率が
      ${calc.nextRate !== null ? (calc.nextRate*100).toFixed(2)+'%' : '次の区分'} に上がります。
      ${nearThreshold?'ぎりぎりの水準なので、決算書の数字が出てから確定するか、法人税を手入力で調整することを検討してください。':''}
    </div>`;

  return `
  <div class="card">
    <h2>年次精算</h2>
    <div class="desc">この会社の決算期: 毎年${fiscalStartMonth}月開始。${calc.isFinal
      ? '<strong>決算確定値モード</strong>です。決算書の法人税等のうち、トレードの課税ベースが会社全体の所得に占める割合分をトレード分の税額とし、各社員の課税ベースの比率で按分します。'
      : '<strong>見込みモード</strong>です。会社全体の課税ベースで判定し、繰越欠損金を差し引いた残りの課税対象額に対する税額を、各社員の課税ベースの比率で按分します。トレード以外の収益は含まれないため、確定値は決算後に「決算確定値」で出し直してください。'}</div>
    <div class="row">
      <div>
        <label>対象年度</label>
        <select onchange="const [s,e]=this.value.split('|'); state.settlementForm.start=s; state.settlementForm.end=e; renderAdminTabContent();">${yearOptions}</select>
      </div>
      <div>
        <label>税額の出し方</label>
        <select onchange="state.settlementForm.taxSource=this.value; state.settlementForm.taxOverride=null; renderAdminTabContent();">
          <option value="estimate" ${!calc.isFinal?'selected':''}>見込み(アプリの段階税率で計算)</option>
          <option value="final" ${calc.isFinal?'selected':''}>決算確定値(決算書の法人税等から按分)</option>
        </select>

    <div class="row" style="margin-top:10px;">
      <div>
        <label>控除に使える繰越欠損金<span class="muted" style="font-weight:400;">${calc.isFinal?'(決算確定値モードでは使いません)':`(残高 ${yen(currentLoss)}${usedThisYear>0?` + この年度で消し込み済みの ${yen(usedThisYear)} を戻した額`:''})`}</span></label>

    <div class="row" style="margin-top:10px;">
      <div>
        <label>法人税の合計<span class="muted" style="font-weight:400;">(決算書が出たらここに実額を入力)</span></label>
        <input type="number" step="1" placeholder="空欄なら自動計算 ${yen(calc.autoTax)}"
               value="${calc.hasOverride ? Math.round(calc.totalTax) : ''}"
               onchange="state.settlementForm.taxOverride = (this.value === '' ? null : Number(this.value)); renderAdminTabContent();" />
      </div>
      <div><label>分配比率(社員側)</label><input type="number" step="0.05" value="${f.splitRate}" onchange="state.settlementForm.splitRate=Number(this.value); renderAdminTabContent();" /></div>
    </div>
    ${calc.hasOverride ? `<div class="row" style="margin-top:10px;">
      <div style="flex:1"><label>修正の理由(任意)</label><input type="text" placeholder="例: 決算報告書の法人税等より転記"
             value="${(f.taxNote||'').replace(/"/g,'&quot;')}"
             onchange="state.settlementForm.taxNote=this.value;" /></div>
    </div>` : ''}
    ${f.lossOverride !== null && f.lossOverride !== undefined && f.lossOverride !== registeredLoss
      ? `<div class="desc" style="margin-top:10px;">⚠︎ 繰越欠損金を手動で上書きしています。<a href="#" onclick="state.settlementForm.lossOverride=null; renderAdminTabContent(); return false;">登録残高(${yen(registeredLoss)})に戻す</a></div>` : ''}
    ${calc.hasOverride
      ? `<div class="desc" style="margin-top:10px;">⚠︎ 法人税を手入力の ${yen(calc.totalTax)} で計算しています(自動計算なら ${yen(calc.autoTax)})。<a href="#" onclick="state.settlementForm.taxOverride=null; renderAdminTabContent(); return false;">自動計算に戻す</a></div>` : ''}
  </div>

  <div class="card">
    <h2>会社全体の税額計算</h2>
    ${calc.isFinal ? `
    <div class="row">
      <div class="stat"><div class="label">トレードの課税ベース合計</div><div class="value ${calc.companyTaxBase<0?'negative':'positive'}">${yen(Math.round(calc.companyTaxBase))}</div></div>
      <div class="stat"><div class="label">会社全体の所得(決算書・欠損金控除前)</div><div class="value">${calc.finalReady?yen(Math.round(calc.companyIncome)):'—'}</div></div>
      <div class="stat"><div class="label">法人税等(決算書の実額)</div><div class="value">${calc.finalReady?yen(Math.round(calc.companyTaxActual)):'—'}</div></div>
    </div>
    <div class="row" style="margin-top:14px;">
      <div class="stat"><div class="label">トレード分の按分割合</div><div class="value">${calc.finalReady?(calc.tradeRatio*100).toFixed(2)+'%':'—'}</div></div>
      <div class="stat"><div class="label">トレード分の法人税${calc.hasOverride?'(手入力)':''}</div><div class="value">${yen(calc.totalTax)}</div></div>
      <div class="stat"><div class="label">繰越欠損金</div><div class="value muted" style="font-size:15px">別表七で管理</div></div>
    </div>
    <div class="desc" style="margin-top:12px;">${taxNote}</div>
    <div class="desc" style="margin-top:10px;">※ 決算確定値モードでは繰越欠損金の自動消し込みは行いません。決算後に「繰越欠損金」タブで別表七の残高に更新してください。</div>
    ` : `
    <div class="row">
      <div class="stat"><div class="label">課税ベース合計(全社員通算)</div><div class="value ${calc.companyTaxBase<0?'negative':'positive'}">${yen(Math.round(calc.companyTaxBase))}</div></div>
      <div class="stat"><div class="label">繰越欠損金の充当額</div><div class="value">${yen(Math.round(calc.lossUsed))}</div></div>
      <div class="stat"><div class="label">課税対象額</div><div class="value">${yen(Math.round(calc.taxableIncome))}</div></div>
    </div>
    <div class="row" style="margin-top:14px;">
      <div class="stat"><div class="label">実効課税割合</div><div class="value">${ratioPct}%</div></div>
      <div class="stat"><div class="label">法人税の合計${calc.hasOverride?'(手入力)':''}</div><div class="value">${yen(calc.totalTax)}<span class="muted" style="font-size:12px;font-weight:400;"> / 実効${(calc.effectiveRate*100).toFixed(2)}%</span></div></div>

    </div>
    <div class="desc" style="margin-top:12px;">${taxNote}</div>
    ${thresholdNote}
    <h3 style="margin-top:18px;margin-bottom:8px;font-size:14px;">税額の内訳${calc.hasOverride?'(自動計算・参考)':''}</h3>

      <tbody>${breakdownRows}</tbody>
    </table>
    ${!calc.bracketsConfigured ? `<div class="desc" style="margin-top:10px;color:var(--warn)">⚠︎ 税率テーブルが未登録のため、一律 ${(calc.taxRate*100).toFixed(0)}% で計算しています。migration_tax_brackets.sql を実行してください。</div>` : ''}
    <div class="desc" style="margin-top:10px;">※ このアプリはトレード部分しか把握していないため、不動産賃料など他の収益があると実際の税率区分とはズレます。決算が終わったら「決算確定値」に切り替えて確定し直してください。</div>
    `}
    <div style="margin-top:16px;">
      <button class="btn-accent" ${isCurrentYear?'disabled':''} onclick="confirmYearSettlement(${allSettled ? 'true' : 'false'})">${btnLabel}</button>
      ${allSettled?`<div class="desc" style="margin-top:8px;">確定済みの年度です。上の金額を直したうえでこのボタンを押すと、<strong>前回との差額だけ</strong>がインセンティブ台帳に追加され、繰越欠損金の消し込みもやり直されます。</div>`:''}
    </div>
  </div>
  ${calc.isFinal ? '' : adminTaxBracketHtml()}
  ${rows}`;
}

/* ---------------------------------------------------------------------
   法人税の税率テーブル(所得区分別)の編集
--------------------------------------------------------------------- */
function adminTaxBracketHtml(){
  const list = (state.adminTaxBrackets||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const rows = list.map((b,i) => `<tr>
    <td class="muted">${i+1}</td>
    <td>${b.upper_limit === null || b.upper_limit === undefined
          ? '<span class="muted">それ以上すべて</span>'
          : `<input type="number" step="1" style="max-width:150px" value="${Number(b.upper_limit)}"
                    onchange="updateTaxBracket('${b.id}','upper_limit',this.value)" /> まで`}</td>
    <td><input type="number" step="0.0001" style="max-width:110px" value="${Number(b.rate)}"
               onchange="updateTaxBracket('${b.id}','rate',this.value)" /></td>
    <td class="num">${(Number(b.rate)*100).toFixed(2)}%</td>
  </tr>`).join('') || `<tr><td colspan="4" class="empty">税率が登録されていません。migration_tax_brackets.sql を実行してください。</td></tr>`;

  return `
  <div class="card">
    <h2>法人税の税率(所得区分別)</h2>
    <div class="desc">課税対象額を区分ごとに切って積み上げる累進計算に使います。初期値は中小法人(資本金1億円以下・外形標準課税対象外)の法定実効税率です。<strong>所在地の自治体や法改正で変わるので、顧問税理士に確認して調整してください。</strong>税率は 0.3358 のように小数で入力します。</div>
    <table>
      <thead><tr><th>区分</th><th>この金額まで</th><th>実効税率</th><th class="num">%</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

async function updateTaxBracket(id, field, value){
  const v = (value === '' ? null : Number(value));
  if(field === 'rate' && (v === null || v < 0 || v > 1)){ alert('税率は 0〜1 の小数で入力してください(例: 33.58% なら 0.3358)'); renderAdminTabContent(); return; }
  const { error } = await sb.from('corporate_tax_brackets').update({ [field]: v }).eq('id', id);
  if(error){ alert('更新に失敗しました: '+error.message); return; }
  loadAdminData();
}

/* 日付文字列に日数を加算 */
function addDaysStr(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0,10);
}

function adminPLHtml(){
  const rows = (state.adminPL||[]).map(p => {
    const remainingLoss = (state.adminLoss||[]).reduce((s,l)=> s + Number(l.remaining_amount||0), 0);
    // 繰越欠損金は「使い切る年」に一部だけ課税されるため、按分ではなく残高を控除して計算する
    const pretax = Number(p.pretax_profit||0);
    const taxableAfterLoss = Math.max(0, pretax - remainingLoss);
    const estimatedTaxNow = Math.round(taxableAfterLoss * Number(p.assumed_tax_rate||0));
    const netAfterTaxEstimate = pretax - estimatedTaxNow;
    return `
    <div class="card">
      <div class="row">
        <div class="stat"><div class="label">対象期間</div><div class="value" style="font-size:15px">${p.fiscal_year_start} 〜 ${p.fiscal_year_end}</div></div>
        <div class="stat"><div class="label">売上高</div><div class="value">${yen(p.revenue)}</div></div>
        <div class="stat"><div class="label">税引前利益</div><div class="value ${p.pretax_profit<0?'negative':'positive'}">${yen(p.pretax_profit)}</div></div>
      </div>
      <div class="row" style="margin-top:14px;">
        <div class="stat"><div class="label">所得金額(欠損金控除前)</div><div class="value ${p.taxable_income_before_loss==null?'muted':''}" ${p.taxable_income_before_loss==null?'style="font-size:15px"':''}>${p.taxable_income_before_loss==null?'未入力':yen(p.taxable_income_before_loss)}</div></div>
        <div class="stat"><div class="label">当期の法人税等(実績)</div><div class="value">${yen(p.tax_amount)}</div></div>
        <div class="stat"><div class="label">当期純利益(実績)</div><div class="value">${yen(p.net_profit)}</div></div>
        <div class="stat"><div class="label">繰越欠損金(残${yen(Math.round(remainingLoss))})を差し引いた想定税引後利益</div><div class="value">${yen(netAfterTaxEstimate)}</div></div>
      </div>
      ${p.notes ? `<div class="desc" style="margin-top:12px;">${p.notes}</div>` : ''}
      <div style="margin-top:14px;">
        <button class="row-delete" onclick="deletePL('${p.id}')">この年度のPLを削除</button>
      </div>
    </div>`;
  }).join('') || `<div class="card"><p class="empty">この会社の簡易PLはまだ登録されていません。</p></div>`;

  return `
    ${rows}

function adminLossHtml(){
  const today = new Date();
  const rows = (state.adminLoss||[]).map(l => {
    const expiry = l.expiry_fiscal_year_end ? new Date(l.expiry_fiscal_year_end) : null;
    const soon = expiry && ((expiry - today) / (1000*60*60*24*365) < 2);
    return `<tr>
      <td>${l.fiscal_year_start} 〜 ${l.fiscal_year_end}</td>
      <td class="num"><input type="number" step="1" style="max-width:130px;text-align:right" value="${Number(l.incurred_amount||0)}"
             onchange="updateLossVintage('${l.id}','incurred_amount',this.value)" /></td>
      <td class="num"><input type="number" step="1" style="max-width:130px;text-align:right" value="${Number(l.used_amount||0)}"
             onchange="updateLossVintage('${l.id}','used_amount',this.value)" /></td>
      <td class="num"><input type="number" step="1" style="max-width:130px;text-align:right;font-weight:700" value="${Number(l.remaining_amount||0)}"
             onchange="updateLossVintage('${l.id}','remaining_amount',this.value)" /></td>
      <td class="${soon?'loss-expiry-warn':''}">${l.expiry_fiscal_year_end || '—'}${soon?' ⚠︎期限間近':''}</td>
      <td class="muted">${l.source_document||''}</td>
      <td><button class="row-delete" onclick="deleteLoss('${l.id}')">削除</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" class="empty">繰越欠損金データはまだ登録されていません</td></tr>`;

  const total = (state.adminLoss||[]).reduce((s,l)=>s+Number(l.remaining_amount||0),0);

  const vintageLabel = Object.fromEntries((state.adminLoss||[]).map(l=>[l.id, `${l.fiscal_year_start} 〜 ${l.fiscal_year_end}`]));
  const usageRows = (state.adminLossUsages||[]).map(u => `<tr>
      <td>〜${u.fiscal_year_end}</td>
      <td>${vintageLabel[u.vintage_id] || '(削除済みの年度)'}</td>
      <td class="num">${yen(u.amount)}</td>
    </tr>`).join('') || `<tr><td colspan="3" class="empty">まだ消し込み履歴はありません</td></tr>`;

  return `
  <div class="card">
    <div class="stat"><div class="label">現在の繰越欠損金残高合計</div><div class="value" style="font-size:28px">${yen(total)}</div></div>
  </div>
  <div class="card">
    <h2>発生年度別の内訳</h2>
    <div class="desc">決算が終わったら、<strong>別表七の期末残高に合わせてここを直接更新してください。</strong>会社全体では不動産賃料などトレード以外の所得でも欠損金が使われるため、アプリの自動消し込み(期中の見込み用)とは差が出ます。決算書の数字が正です。</div>
    <table>
      <thead><tr><th>発生事業年度</th><th class="num">発生額</th><th class="num">控除済み累計</th><th class="num">繰越残額</th><th>失効期限</th><th>出典</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div class="card">
    <h2>消し込み履歴</h2>
    <div class="desc">年次精算を確定したときに、発生年度の古いものから自動で消し込まれた記録です。</div>
    <table>
      <thead><tr><th>使った年度</th><th>充当した発生年度</th><th class="num">充当額</th></tr></thead>
      <tbody>${usageRows}</tbody>
    </table>
  </div>
  <div class="card">
    <h2>欠損金データを追加</h2>
    <div class="desc">決算書(別表七)の内容を年度ごとに転記してください。失効期限の目安は発生事業年度の期末+10年です。</div>
    <div class="row">
      <div><label>発生事業年度・期首</label><input type="date" id="loss-start" /></div>
      <div><label>発生事業年度・期末</label><input type="date" id="loss-end" /></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div><label>発生額</label><input type="number" id="loss-incurred" /></div>
      <div><label>控除済み累計</label><input type="number" id="loss-used" value="0" /></div>
      <div><label>繰越残額</label><input type="number" id="loss-remaining" /></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div><label>失効期限</label><input type="date" id="loss-expiry" /></div>
      <div><label>出典メモ</label><input type="text" id="loss-doc" placeholder="例: 第12期 別表七(一)" /></div>
    </div>
    <div style="margin-top:14px;">
      <button class="btn-accent" onclick="submitLossForm()">保存</button>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   会社の利益蓄積の集計（インセンティブタブで表示）
   ---------------------------------------------------------------------
   蓄積額 = Σ会社取り分 − Σ会社負担経費

   会社取り分は年次精算で確定した (投資収益 − 報酬 − 法人税) × (1 − 分配比率)。
   分配比率が50%なので、確定時点では会社取り分と社員取り分は同額になる。
   そこから差が開いていくのは、社員側が自分の経費をインセンティブから取り崩したり
   引き出したりする一方、会社側は会社負担の経費を差し引くため。
   マイナス年度は社員が全額を負担するルールのため、会社取り分は0(会社側は減らない)。
   「インセンティブから控除」を選んだ経費は社員のインセンティブ残高から引かれるので、
   会社の蓄積額には影響しない。
--------------------------------------------------------------------- */
function computeRetainedSummary(){
  const employees        = state.adminEmployees || [];
  const settlements      = state.adminSettlements || [];
  const incentiveExpenses= (state.adminAnnualExpenses||[]).filter(e => e.funded_by === 'incentive');
  const sum = (arr, f) => arr.reduce((s,x) => s + Number(f(x)||0), 0);

  // 会社負担経費は年次精算の時点で分配対象額から引かれているため、
  // 会社取り分(company_share)はすでに経費控除後の金額。ここで再度引くと二重控除になる。
  // 表示用に、精算時に保存した会社負担経費(company_expense_cost)を並べて出す。
  const perEmployee = employees.map(emp => {
    const ss = settlements.filter(s => s.employee_id === emp.id);
    return {
      emp,
      years:  ss.length,
      profit: sum(ss, s => s.investment_profit),
      reward: sum(ss, s => s.salary_cost),
      cexp:   sum(ss, s => s.company_expense_cost),
      tax:    sum(ss, s => s.tax_cost),
      share:  sum(ss, s => s.company_share),
    };
  });

  // ---- 年度ごとの推移(古い順に累計を積み上げ) ----
  const yearKeys = [...new Set(settlements.map(s => s.fiscal_year_end))].filter(Boolean).sort();

  let running = 0;
  const yearData = yearKeys.map(y => {
    const inYear = settlements.filter(s => s.fiscal_year_end === y);
    const share  = sum(inYear, s => s.company_share);
    const cexp   = sum(inYear, s => s.company_expense_cost);
    running += share;
    return { y, share, cexp, cumulative: running };
  });

  const totals = {
    profit: sum(perEmployee, r => r.profit),
    reward: sum(perEmployee, r => r.reward),
    cexp:   sum(perEmployee, r => r.cexp),
    tax:    sum(perEmployee, r => r.tax),
    share:  sum(perEmployee, r => r.share),
    incentiveExpense: sum(incentiveExpenses, e => e.amount),
  };

  return { perEmployee, yearData, totals };
}

/* 繰越欠損金の金額を直接編集する（決算後に別表七の数字へ合わせる用） */
async function updateLossVintage(id, field, value){
  const v = Number(value);
  if(isNaN(v) || v < 0){ alert('0以上の数字を入力してください'); renderAdminTabContent(); return; }
  const { error } = await sb.from('loss_carryforward_vintages').update({ [field]: v }).eq('id', id);
  if(error){ alert('更新に失敗しました: '+error.message); return; }
  loadAdminData();
}

  addLoss({

    end: document.getElementById('loss-end').value,
    incurred: Number(document.getElementById('loss-incurred').value)||0,
    used: Number(document.getElementById('loss-used').value)||0,
    remaining: Number(document.getElementById('loss-remaining').value)||0,
    expiry: document.getElementById('loss-expiry').value || null,
    doc: document.getElementById('loss-doc').value,
  });
}
